<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Dashboard</title>

    <link rel="stylesheet" href="../css/reportstyles.css">
</head>

<body>

<div class="container">

    <header class="header">
        <h1>📊 Reports & Analytics Dashboard</h1>
        <p>Food Rescue Platform Overview</p>
    </header>

    <section class="cards">

        <div class="card">
            <h2 id="totalDonors">0</h2>
            <p>Total Donors</p>
        </div>

        <div class="card">
            <h2 id="totalNGOs">0</h2>
            <p>Total NGOs</p>
        </div>

        <div class="card">
            <h2 id="totalDonations">0</h2>
            <p>Total Donations</p>
        </div>

        <div class="card">
            <h2 id="totalRequests">0</h2>
            <p>Total Requests</p>
        </div>

        <div class="card">
            <h2 id="totalAllocations">0</h2>
            <p>Total Allocations</p>
        </div>

    </section>

    <section class="report-table">

        <h2>System Summary</h2>

        <table>

            <thead>
                <tr>
                    <th>Category</th>
                    <th>Total Count</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Donors</td>
                    <td id="donorCount">0</td>
                </tr>

                <tr>
                    <td>NGOs</td>
                    <td id="ngoCount">0</td>
                </tr>

                <tr>
                    <td>Donations</td>
                    <td id="donationCount">0</td>
                </tr>

                <tr>
                    <td>Requests</td>
                    <td id="requestCount">0</td>
                </tr>

                <tr>
                    <td>Allocations</td>
                    <td id="allocationCount">0</td>
                </tr>

            </tbody>

        </table>

    </section>

</div>

<script src="../js/reports.js"></script>

</body>
</html>
