<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="../css/authstyles.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                <h1>Reset Password</h1>
                <p>Email Verification Required</p>
            </div>

            <!-- Registered Email -->
            <div class="form-group">
                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter Registered Email">
            </div>

            <!-- Send OTP -->
            <div class="form-group">
                <button
                    type="button"
                    onclick="sendResetOTP()">
                    Send OTP
                </button>
            </div>

            <!-- OTP -->
            <div class="form-group">
                <input
                    type="text"
                    id="resetOTP"
                    placeholder="Enter OTP">
            </div>

            <!-- Verify OTP -->
            <div class="form-group">
                <button
                    type="button"
                    onclick="verifyResetOTP()">
                    Verify OTP
                </button>
            </div>

            <!-- OTP Message -->
            <p id="resetOtpMessage"></p>

            <!-- New Password -->
            <div class="form-group">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter New Password">
            </div>

            <!-- Update Password -->
            <div class="form-group">
                <button
                    type="button"
                    onclick="resetPassword()">
                    Update Password
                </button>
            </div>

            <div class="link">
                <a href="login.html">
                    Back To Login
                </a>
            </div>

        </div>

    </div>

    <!-- EmailJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Initialize EmailJS -->
    <script>
        emailjs.init({
            publicKey: "3NMNF61P5Dmn8KIX5"
        });
    </script>

    <!-- Auth JS -->
    <script src="../js/auth.js"></script>

</body>

</html>
