<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Request Management</title>

<link rel="stylesheet" href="../css/requeststyles.css">
</head>

<body>

<div class="container">

    <header class="dashboard-header">
        <h1>🍱 Food Request Management</h1>
        <p>Manage NGO Food Requirements</p>
    </header>

    <section class="stats-container">

        <div class="stat-card">
            <h2 id="totalRequests">0</h2>
            <p>Total Requests</p>
        </div>

        <div class="stat-card">
            <h2 id="pendingRequests">0</h2>
            <p>Pending</p>
        </div>

        <div class="stat-card">
            <h2 id="approvedRequests">0</h2>
            <p>Approved</p>
        </div>

        <div class="stat-card">
            <h2 id="completedRequests">0</h2>
            <p>Completed</p>
        </div>

    </section>

    <section class="form-section">

        <h2>Create Food Request</h2>

        <div class="form-grid">

            <input
                type="text"
                id="ngoName"
                placeholder="NGO Name">

            <input
                type="text"
                id="foodItem"
                placeholder="Food Item">

            <input
                type="number"
                id="quantity"
                placeholder="Quantity">

            <input
                type="text"
                id="location"
                placeholder="Location">

            <select id="status">
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Completed">Completed</option>
            </select>

        </div>

        <button onclick="addRequest()">
            Add Request
        </button>

    </section>

    <section class="table-section">

        <h2>Food Requests</h2>

        <table>

            <thead>
                <tr>
                    <th>NGO</th>
                    <th>Food Item</th>
                    <th>Quantity</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="requestTableBody">
            </tbody>

        </table>

    </section>

</div>

<script src="../js/requests.js"></script>

</body>
</html>
