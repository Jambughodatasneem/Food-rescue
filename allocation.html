<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Allocation System</title>

    <link rel="stylesheet" href="../css/allocationstyles.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>🍱 Food Allocation Dashboard</h1>
            <p>Match Food Donations with NGO Requests</p>
        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card">
                <h2 id="totalDonations">0</h2>
                <p>Total Donations</p>
            </div>

            <div class="stat-card">
                <h2 id="totalRequests">0</h2>
                <p>Total Requests</p>
            </div>

            <div class="stat-card">
                <h2 id="totalAllocations">0</h2>
                <p>Total Allocations</p>
            </div>

            <div class="stat-card">
                <h2 id="remainingFood">0</h2>
                <p>Allocated Quantity</p>
            </div>

        </div>

        <!-- Allocation Form -->
        <div class="card">

            <h2>Allocate Food</h2>

            <div class="form-grid">

                <div>
                    <label>Select Donation</label>
                    <select id="donationSelect">
                        <option value="">Select Donation</option>
                    </select>
                </div>

                <div>
                    <label>Select NGO Request</label>
                    <select id="requestSelect">
                        <option value="">Select Request</option>
                    </select>
                </div>

                <div>
                    <label>Allocated Quantity</label>
                    <input
                        type="number"
                        id="allocatedQuantity"
                        placeholder="Enter Quantity">
                </div>

            </div>

            <button onclick="allocateFood()">
                Allocate Food
            </button>

        </div>

        <!-- Allocation History -->
        <div class="card">

            <h2>Allocation History</h2>

            <table>

                <thead>
                    <tr>
                        <th>NGO Name</th>
                        <th>Food Item</th>
                        <th>Quantity</th>
                        <th>Allocation Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="allocationTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="../js/allocation.js"></script>

</body>

</html>
