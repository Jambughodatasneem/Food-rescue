<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="../css/authstyles.css">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            <h1>Food Rescue</h1>
            <p>Login Account</p>
        </div>

        <div class="form-group">
            <input type="email"
            id="loginEmail"
            placeholder="Email">
        </div>

        <div class="form-group">
            <input type="password"
            id="loginPassword"
            placeholder="Password">
        </div>

        <div class="checkbox">
            <input type="checkbox"
            id="rememberMe">
            <label>Remember Me</label>
        </div>

        <button onclick="loginUser()">
            Login
        </button>

        <div class="link">
            <a href="forgotpassword.html">
                Forgot Password?
            </a>
        </div>

        <div class="link">
            <a href="register.html">
                Create New Account
            </a>
        </div>

    </div>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
